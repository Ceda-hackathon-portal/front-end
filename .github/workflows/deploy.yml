name: Deploy

# Builds the site and publishes it to S3 behind CloudFront.
# Authenticates to AWS with GitHub OIDC: no long-lived AWS keys are stored in GitHub.
# The job is skipped until the production environment is configured (see README).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.S3_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'af-south-1' }}

      - name: Upload hashed assets (long cache)
        run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete
          --exclude index.html
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (always revalidate)
        run: >
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html"
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/index.html"
